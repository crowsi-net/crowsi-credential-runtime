[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-credential-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Authenticated one-use credential execution boundary for Crowsi"
license = "Apache-2.0"
readme = "README.md"
publish = ["ecosystem-private"]
repository = "https://github.com/crowsi-net/crowsi-credential-runtime"

[package.metadata.crowsi]
boundary = "credential-use"
request-schema = "crowsi://credential-runtime/use-request/v1"
receipt-schema = "crowsi://credential-runtime/use-receipt/v1"
raw-credentials-cross-ipc = false

[workspace]
members = ["."]
resolver = "3"

[features]
default = []
test-support = []

[dependencies]
crowsi-credential-broker = { version = "=0.1.0", registry = "ecosystem-private" }
crowsi-local-control-bridge = { version = "=0.1.0", registry = "ecosystem-private" }
nix = { version = "0.29.0", features = ["poll"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.18"
zeroize = { version = "=1.8.2", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
